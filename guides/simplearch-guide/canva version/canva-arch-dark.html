  <meta charset="UTF-8">

  <title>SimpleArch — Pre-Installation Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    :root{
      --page:#10151d;
      --page-deep:#0b1017;
      --surface:#171f2a;
      --surface-raised:#1d2734;
      --surface-soft:#202c3a;
      --ink:#f2f5f8;
      --muted:#a8b5c6;
      --dim:#74839a;
      --line:#344457;
      --line-strong:#52657b;
      --blue:#9ab9dc;
      --amber:#efb45a;
      --amber-ink:#ffd99a;
      --amber-bg:#302719;
      --focus:#9ecaff;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--page-deep)}
    body{
      width:100%;
      margin:0;
      color:var(--ink);
      font-family:"DM Sans",sans-serif;
      background:var(--page);
    }
    .mono,code,kbd{
      font-family:"Space Mono",monospace;
      font-size:.84em;
      background:#263444;
      border:1px solid #3c5067;
      padding:.12rem .32rem;
      border-radius:4px;
      color:#e6f0fc;
    }
    .app-shell{
      width:100%;
      min-height:calc(100 * min(var(--vh, 1vh), 1vh));
      background:
        radial-gradient(circle at 82% -5%,rgba(66,91,120,.22),transparent 29rem),
        linear-gradient(180deg,#151d27 0%,var(--page) 20rem,var(--page-deep) 100%);
    }
    .docs-header{
      position:sticky;
      top:0;
      z-index:30;
      background:rgba(15,21,29,.94);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(14px);
    }
    .header-inner{
      max-width:1240px;
      height:64px;
      margin:auto;
      padding:0 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .brand{
      font-family:"Space Mono",monospace;
      font-weight:700;
      font-size:14px;
      letter-spacing:-.04em;
    }
    .top-link{
      font-size:14px;
      color:var(--muted);
      text-decoration:none;
      padding:9px 10px;
      border-radius:5px;
      transition:background .18s ease,color .18s ease;
    }
    .top-link:hover,.top-link.active{color:var(--ink);background:#253242}
    .top-link.active{font-weight:700}
    .layout{
      max-width:1240px;
      margin:auto;
      padding:34px 24px 70px;
      display:grid;
      grid-template-columns:205px minmax(0,1fr);
      gap:42px;
    }
    .step-nav{position:sticky;top:92px;height:max-content}
    .step-nav h2{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.1em;
      color:var(--dim);
      margin:0 0 11px;
    }
    .step-index{display:flex;flex-direction:column;gap:2px}
    .step-index button{
      appearance:none;
      border:0;
      background:none;
      text-align:left;
      padding:8px 10px;
      border-left:2px solid transparent;
      color:var(--muted);
      font-size:13px;
      cursor:pointer;
      transition:background .18s ease,color .18s ease;
    }
    .step-index button:hover{color:var(--ink);background:#1c2734}
    .step-index button.active{
      border-left-color:var(--amber);
      color:var(--ink);
      background:#222f3d;
      font-weight:700;
    }
    .guide{min-width:0}
    .crumb{font-size:12px;color:var(--dim);margin-bottom:14px}
    .step-label{
      font:700 11px "Space Mono",monospace;
      color:var(--amber);
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .segments{
      display:grid;
      grid-template-columns:repeat(10,1fr);
      gap:5px;
      margin:12px 0 31px;
    }
    .segment{
      height:4px;
      border:0;
      padding:0;
      background:#344252;
      border-radius:99px;
      cursor:pointer;
      transition:background .2s ease;
    }
    .segment:hover{background:#61768f}
    .segment.active{background:var(--amber)}
    .segment:focus-visible,.step-index button:focus-visible,.nav-btn:focus-visible,.top-link:focus-visible,.placeholder-link:focus-visible{
      outline:3px solid var(--focus);
      outline-offset:3px;
    }
    h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.045em;line-height:1.08;margin:0 0 12px;color:var(--ink)}
    h2{font-size:22px;letter-spacing:-.025em;margin:0 0 12px;color:var(--ink)}
    h3{font-size:15px;margin:0 0 8px;color:var(--ink)}
    p{color:var(--muted);line-height:1.68;margin:0 0 15px}
    .intro{font-size:17px;max-width:760px;color:#c3cfdb}
    .section{display:none;animation:rise .25s ease}
    .section.active{display:block}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .block{border-top:1px solid var(--line);padding-top:30px;margin-top:30px}
    .split{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(280px,.95fr);
      gap:34px;
      align-items:center;
      margin:28px 0;
    }
    .split.reverse .copy{order:2}
    .split.reverse .shot{order:1}
    .copy ul,.copy ol{color:var(--muted);padding-left:20px;line-height:1.65;margin:8px 0}
    .copy li{margin-bottom:5px}
    .shot{
      margin:0;
      background:linear-gradient(145deg,#202c3a,#19232f);
      border:1px dashed #607895;
      box-shadow:inset 0 0 0 1px rgba(164,193,225,.04);
      aspect-ratio:16/9;
      min-height:170px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#aebfd1;
      padding:20px;
    }
    .shot svg{width:24px;height:24px;margin-bottom:10px;color:#91aac5}
    .shot span{font:11px "Space Mono",monospace;line-height:1.5}
    .wide-shot{margin:28px 0}
    .callout{
      border:1px solid #99753a;
      background:var(--amber-bg);
      padding:17px 18px;
      display:flex;
      gap:11px;
      margin:24px 0;
    }
    .callout svg{color:var(--amber);width:19px;min-width:19px}
    .callout strong{display:block;color:var(--amber-ink);font-size:14px;margin-bottom:4px}
    .callout p{font-size:13px;color:#e8c98e;margin:0;line-height:1.55}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:21px 0}
    .compare{background:var(--surface);border:1px solid var(--line);padding:18px}
    .compare small{font:700 10px "Space Mono",monospace;color:#8ea3ba;text-transform:uppercase}
    .compare h3{margin-top:7px}
    .compare p{font-size:13px;margin:0}
    .note{
      border-left:3px solid #7791ae;
      background:#1b2734;
      padding:14px 16px;
      margin:18px 0;
      font-size:13px;
      color:#b8c6d5;
      line-height:1.6;
    }
    .gallery{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);margin:18px 0}
    .gallery div{
      padding:13px 8px;
      text-align:center;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      font:11px "Space Mono",monospace;
      color:#aebfd1;
      background:#17212c;
    }
    .drivers{grid-template-columns:repeat(5,1fr)}
    .placeholder-link{color:#b7d5f3;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:3px;font-weight:600}
    .placeholder-link:hover{color:#e2effc}
    .bottom-nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:42px;padding-top:22px}
    .nav-btn{
      border:1px solid #596d84;
      background:#202c39;
      color:#e7eef5;
      padding:11px 14px;
      font:600 13px "DM Sans",sans-serif;
      cursor:pointer;
      transition:background .18s ease,border-color .18s ease;
    }
    .nav-btn:hover:not(:disabled){background:#2a394a;border-color:#7890aa}
    .nav-btn.next{background:#b97a21;color:#15110a;border-color:#d69b45}
    .nav-btn.next:hover:not(:disabled){background:#d3902e;border-color:#efb45a}
    .nav-btn:disabled{opacity:.35;cursor:not-allowed}
    .final{border:1px solid #566f8c;background:#1b2938;padding:25px;margin-top:30px}
    .final h2{margin-bottom:7px}
    .toast{
      position:fixed;
      right:22px;
      bottom:22px;
      z-index:50;
      background:#263545;
      border:1px solid #627994;
      color:#f4f7fa;
      padding:12px 15px;
      font-size:13px;
      box-shadow:0 12px 32px rgba(0,0,0,.45);
      display:none;
    }
    .toast.show{display:block}
    @media(max-width:820px){
      .layout{grid-template-columns:1fr;padding:24px 16px 50px}
      .step-nav{position:static;overflow:auto;width:100%;padding-bottom:5px}
      .step-index{flex-direction:row;width:max-content}
      .step-index button{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}
      .step-index button.active{border-left:0;border-bottom-color:var(--amber)}
      .split,.split.reverse{grid-template-columns:1fr;gap:18px}
      .split.reverse .copy{order:1}.split.reverse .shot{order:2}
      .cards{grid-template-columns:1fr}
      .gallery{grid-template-columns:repeat(3,1fr)}
      .drivers{grid-template-columns:repeat(2,1fr)}
      .header-inner{padding:0 16px}.header-inner nav{display:flex}
      .top-link{padding:8px 6px;font-size:12px}
    }
  </style>

 <body data-template-id="__page-root" style="background: rgb(16, 21, 29);">
  <div class="app-shell">
   <header class="docs-header canva-header" data-template-id="site-header" style="background: rgb(15, 21, 29);">

  <script>
    const shot = caption => `<figure class="shot"><i data-lucide="terminal-square"></i><span>[ screenshot placeholder ]<br>${caption}</span></figure>`;
    const split = (copy, caption, reverse = false) => `<div class="split ${reverse ? "reverse" : ""}"><div class="copy">${copy}</div>${shot(caption)}</div>`;
    const wide = caption => `<div class="wide-shot">${shot(caption)}</div>`;
    const cards = (a, b) => `<div class="cards"><article class="compare"><small>${a[0]}</small><h3>${a[1]}</h3><p>${a[2]}</p></article><article class="compare"><small>${b[0]}</small><h3>${b[1]}</h3><p>${b[2]}</p></article></div>`;
    const callout = (title, text) => `<aside class="callout"><i data-lucide="triangle-alert"></i><div><strong>${title}</strong><p>${text}</p></div></aside>`;

    const steps = [
      {
        crumb: "Guide > Introduction",
        title: "Introduction & TUI Navigation",
        next: "Next: Locales & Mirrors →",
        body: `
          <p class="intro">A quick orientation before touching the installer. Use the terminal and TUI deliberately; every selection here becomes part of your installation plan.</p>
          ${split(`<h2>Navigate the TUI</h2><p>Use arrow keys or <kbd>j</kbd>/<kbd>k</kbd> like vim. <kbd>/</kbd> opens a fuzzy finder only in sub-menus where it is available or enabled. <kbd>Esc</kbd> cancels and goes back from a sub-menu; <kbd>Enter</kbd> selects.</p><p>In multi-select menus, use <kbd>Space</kbd> rather than a single-select action. <kbd>Tab</kbd> does not work for this.</p><div class="note"><b>Initial defaults:</b> Archinstall language <code>default</code> · Locales <code>default</code></div>`, "Arch Linux ISO First Boot (Root shell prompt)")}
          ${split(`<h2>Start archinstall</h2><p>Run the installer from the root shell, then use the keyboard controls consistently as you move through each sub-menu.</p>`, "Running archinstall command in terminal", true)}
          ${wide("Archinstall TUI Main Menu & Keyboard Navigation Controls")}
          <div class="block"><h2>Two approaches</h2>${cards(["Vanilla TUI", "Browse menus independently and keep track of choices.", ""], ["SimpleArch Step Flow", "Follow a deliberate sequence with a practical post-install target.", ""])}</div>`
      },
      {
        crumb: "Guide > Mirrors & Repos",
        title: "Locales, Mirrors & Repositories",
        prev: "← Back: Introduction",
        next: "Next: Disk & Btrfs →",
        body: `
          <p class="intro">Set mirrors and repositories early so downloads are fast and the needed compatibility libraries are available.</p>
          ${split(`<h2>Choose nearby mirrors</h2><p>Set the region to your own country, or a nearby one, for better download speeds.</p>`, "Selecting Mirrors and Repositories in main menu")}
          ${split(`<h2>Find your region</h2><p>Open the region selection sub-menu and navigate the regional mirror list. Use fuzzy filtering where available to narrow it down.</p>`, "Opening Region selection sub-menu", true)}
          ${split(`<h2>Add repositories</h2><p>Select optional repositories, then add <code>multilib</code>. Important 32-bit libraries are needed by Steam, Wine, and Proton, among other use cases.</p>`, "Selecting Optional Repositories")}
          ${split(`<h2>Enable multilib</h2><p>Toggle the <code>multilib</code> checkbox before leaving the repository settings.</p>`, "Enabling multilib checkbox", true)}
          ${wide("Final confirmed Mirrors and Repositories overview")}`
      },
      {
        crumb: "Guide > Disk & Filesystem",
        title: "Disk Partitioning, Encryption & Snapshots",
        prev: "← Back: Mirrors & Repos",
        next: "Next: Swap & Memory →",
        body: `
          <p class="intro">Choose a simple Btrfs layout, optionally protect it with LUKS, then enable snapshots for later rollback.</p>
          <div class="block"><h2>Disk & Btrfs Partitioning</h2>
          ${split(`<p>Choose <code>Best-effort</code> in most cases, then <code>Btrfs</code>. Use the default volume structure, enable compression, and do not disable copy-on-write.</p>${callout("Do not touch LVM.", "Leave LVM alone for this recommended flow.")}`, "Selecting Disk Configuration menu")}
          ${split(`<p>Select the target installation disk carefully, then continue with the recommended automatic partitioning approach.</p>`, "Selecting target installation disk and Best-effort partitioning", true)}
          ${split(`<p>Keep the default Btrfs volume structure and enable transparent <code>zstd</code> compression while keeping copy-on-write enabled.</p>`, "Confirming Btrfs subvolumes and compression")}
          ${wide("Completed partition layout overview")}</div>
          <div class="block"><h2>LUKS Disk Encryption</h2><p>Encryption is recommended. You can skip it, but it is strongly encouraged.</p>
          ${split(`<ul><li>Encryption type: <code>LUKS</code></li><li>Set a personal encryption password.</li><li>Keep iteration time as is.</li><li>Select the partition.</li><li><code>HSM</code> is for a YubiKey or similar physical security key; most people should skip it after doing their own research.</li></ul>`, "Entering Disk Encryption menu")}
          ${split(`<p>Continue through the LUKS configuration carefully and confirm the encrypted partition layout.</p>`, "LUKS configuration and encrypted partition confirmation", true)}</div>
          <div class="block"><h2>Btrfs Snapshots</h2>${split(`<p>After leaving the encryption sub-menu, select Btrfs snapshots. Choose <code>Snapper</code>. Timeshift is also good, but Snapper integrates with later boot-menu snapshot rollback.</p>`, "Selecting Snapper as snapshot manager")}</div>`
      },
      {
        crumb: "Guide > Swap",
        title: "Swap on zram & Performance Tuning",
        prev: "← Back: Disk & Filesystem",
        next: "Next: Bootloader & Splash →",
        body: `
          <p class="intro">Enable Swap on zram. Most of the extra options can be ignored.</p>
          ${split(`<h2>Enable zram</h2><p>Toggle Swap on zram to <code>Yes</code>.</p>`, "Toggling Swap on zram to Yes")}
          ${split(`<h2>Modern hardware</h2><p>Choose <code>zstd</code> for modern CPUs.</p>`, "Modern Hardware Default: zstd compression algorithm", true)}
          ${split(`<h2>Older or weak hardware</h2><p>Choose <code>lz4</code> for very old or weak hardware and lower CPU overhead. The rest is noise—skip it.</p>`, "Legacy Hardware Alternative: selecting lz4")}`
      },
      {
        crumb: "Guide > Bootloader",
        title: "Bootloader & Plymouth Splash",
        prev: "← Back: Swap",
        next: "Next: Kernel Selection →",
        body: `
          <p class="intro">Use either <code>GRUB</code> or <code>Limine</code>. The other options lack the features needed to link snapshots to the bootloader in the desired rollback setup.</p>
          ${split(`<h2>Choose a rollback-ready bootloader</h2><p>Move away from the default and select <code>Limine</code> or <code>GRUB</code>.</p>`, "Default systemd-boot highlighted (to be changed)")}
          ${split(`<h2>Plymouth</h2><p>On old hardware, keep Plymouth disabled. Otherwise enable it and select <code>details</code> for easier first-install diagnostics. Switch to a nicer theme later, after confirming everything works.</p>`, "Selecting Plymouth details theme", true)}
          ${callout("Keep Unified Kernel Image (UKI) disabled for now", "Limine requires separate kernel and initramfs files, while UKIs bundle them into one signed EFI executable. The combination needs extra tooling and can break both boot entries and snapshot rollback.")}
          ${split(`<h2>Unified Kernel Image</h2><p>A UKI bundles kernel, initramfs, and boot parameters into one signed executable. It can help later with Secure Boot, but keep it disabled now: Limine does not detect UKIs automatically.</p><p><b>Install to removable location:</b> keep disabled for a normal internal-disk desktop.</p>`, "Unified Kernel Image prompt", true)}
          ${wide("Final configured Bootloader settings summary")}
          <div class="block"><h2>Before and after</h2>${cards(["Before: Vanilla Default", "systemd-boot, no snapshot menu", ""], ["After: SimpleArch Configured", "Limine + Plymouth details + snapshot rollback", ""])}</div>`
      },
      {
        crumb: "Guide > Kernels",
        title: "Kernel Selection & System Fallback",
        prev: "← Back: Bootloader",
        next: "Next: Hostname & Security →",
        body: `
          <p class="intro">You can select more than one kernel. A second kernel is a practical fallback when an update causes a regression.</p>
          ${split(`<h2>Official kernel choices</h2><ul><li><code>linux</code>: vanilla mainline Arch; closely tracks upstream, gets features and hardware support fastest.</li><li><code>linux-lts</code>: Long Term Support; backported security and bug fixes without feature churn.</li><li><code>linux-zen</code>: tuned for desktop responsiveness, gaming, audio/video work, and multitasking.</li><li><code>linux-hardened</code>: extra hardening and exploit mitigations, with possible NVIDIA and AUR compatibility trade-offs.</li></ul>`, "Listing the 4 official Arch kernels")}
          ${split(`<h2>Quick picks</h2><ul><li>Default / general use → <code>linux</code></li><li>Stability-focused → <code>linux</code> + <code>linux-lts</code></li><li>Gaming → <code>linux-zen</code> + <code>linux-lts</code></li><li>Security-focused → <code>linux-hardened</code> + <code>linux-lts</code></li></ul>`, "Multi-selecting dual kernels", true)}
          ${cards(["Primary Mainline Kernel", "Fastest feature and hardware support path.", ""], ["Long-Term Support Fallback", "A calmer backup route when mainline updates regress.", ""])}`
      },
      {
        crumb: "Guide > Authentication",
        title: "Hostname, Authentication & Security",
        prev: "← Back: Kernel Selection",
        next: "Next: Profile Selection →",
        body: `
          <p class="intro">A hostname is the machine’s name—not the user’s name. Think <code>who @ which machine</code>: <code>haw@elitedesk-800</code>.</p>
          ${split(`<h2>Name the machine</h2><p>The hostname identifies the machine on a network and stays the same regardless of who logs in. Examples: <code>kitchen-pc</code>, <code>server-pc</code>, <code>laptop</code>.</p>`, "Setting machine hostname")}
          ${split(`<h2>Root password</h2><p>For most users, leave the root password unset. Direct root login is then disabled, making <code>sudo</code> the only admin path.</p>`, "Root password prompt", true)}
          ${split(`<h2>User account</h2><p>Add one or more users, set each username and password, and choose whether each receives <code>sudo</code>.</p>`, "User accounts menu")}
          ${split(`<h2>U2F login setup</h2><p>This enrolls a physical YubiKey/FIDO2-style key for login, analogous to the <code>HSM</code> option in disk encryption.</p>`, "U2F / FIDO2 setup menu", true)}`
      },
      {
        crumb: "Guide > Profile",
        title: "Profile Selection (Minimal vs Desktop Bundles)",
        prev: "← Back: Hostname & Security",
        next: "Next: Network & Applications →",
        body: `
          <p class="intro">Pick the installation base that matches how much of the graphical system you want bundled up front.</p>
          ${split(`<h2>Profile types</h2><ul><li><code>Desktop</code>: a bundle of compositors, window managers, and desktop environments.</li><li><code>Minimal</code>: no desktop environment, window manager, or graphical stack.</li><li><code>Server</code>: a headless SSH box.</li><li><code>Xorg</code>: only the Xorg display server.</li></ul>`, "Entering Profile menu")}
          ${split(`<p>Desktop needs an internet connection and gives you a ready-made bundle. Minimal is useful for building everything yourself or when no internet is available during install.</p>`, "Profile Type choices", true)}
          ${callout("Choose Minimal so SimpleArch can assemble your customized, clean daily-driver stack post-install.", "For users who want to build and rice their own setup, Minimal avoids an unwanted bundle and is the preferred SimpleArch starting point.")}
          <p>Learn the underlying concepts: <a href="#unresolved" class="placeholder-link">[Source placeholder: desktop environment / window manager explanation]</a>. After installation, <a href="#unresolved" class="placeholder-link">[SimpleArch source placeholder]</a>.</p>
          <h2>Gallery Slot A — pre-bundled environments</h2>
          <div class="gallery">${["Hyprland","Sway","i3","GNOME","Plasma","Environment 06","Environment 07","Environment 08","Environment 09","Environment 10","Environment 11","Environment 12"].map(x => `<div>${x}</div>`).join("")}</div>
          <h2>Gallery Slot B — graphics drivers</h2>
          <div class="gallery drivers">${["All Open-Source","AMD/ATI","Intel","NVIDIA open-kernel","NVIDIA Nouveau"].map(x => `<div>${x}</div>`).join("")}</div>`
      },
      {
        crumb: "Guide > Services",
        title: "Applications, Network & System Services",
        prev: "← Back: Profile Selection",
        next: "Next: Installation Confirmation →",
        body: `
          <p class="intro">This Application step is not general app installation. It covers Bluetooth, printers, audio, firewall, fonts, networking, Pacman, packages, and time.</p>
          ${split(`<h2>Applications and services</h2><ul><li>Bluetooth: <code>yes</code></li><li>Audio: <code>PipeWire</code>, not PulseAudio</li><li>Printing services: <code>yes</code></li><li>Firewall: <code>ufw</code> for simplicity; <code>firewalld</code> for advanced setups</li><li>Additional fonts: optional</li></ul>`, "Audio server selection: choosing PipeWire")}
          ${split(`<h2>Network configuration</h2><p>Use the default NetworkManager backend for older Wi-Fi hardware; use <code>iwd</code> for newer hardware when it works well with your chipset.</p>`, "NetworkManager backend selection", true)}
          ${split(`<h2>Pacman, packages & time</h2><p>For Pacman, enable <code>color</code> and nothing else. Additional packages are optional and can be installed post-install. Use the fuzzy finder to choose your timezone, and keep Automatic time sync enabled.</p>`, "Timezone and automatic time sync settings")}`
      },
      {
        crumb: "Guide > Install & Reboot",
        title: "Installation Confirmation & Reboot",
        prev: "← Back: Applications & Services",
        next: "Back to Top",
        body: `
          <p class="intro">Double-check every selection, then choose Install. Confirmation is irreversible.</p>
          ${split(`<h2>Install deliberately</h2><p>Choose <code>Install</code>, then confirm when prompted. Typical installation time is 3–10 minutes depending on internet, disk, and CPU. More than 15 minutes likely indicates a problem.</p>`, "Selecting the final Install menu button")}
          ${split(`<p>Confirm the irreversible installation action, then wait for the installation to complete.</p>`, "Final confirmation prompt and live installation timer", true)}
          ${split(`<h2>Reboot into the new system</h2><p>The completion prompt asks <b>What would you like to do next?</b> Choose <b>Reboot system</b>, press <kbd>Enter</kbd>, and remove the USB installation flash drive when the machine restarts.</p>`, "Installation complete dialog: selecting Reboot system")}
          <section class="final"><h2>Reboot into Clean Arch → Run SimpleArch Selector</h2><p>Remove the installation USB drive and reboot. Your clean Arch base is ready for SimpleArch.</p><button type="button" class="nav-btn next" id="launchSelector">Launch SimpleArch Component Selector</button></section>`
      }
    ];

    const index = document.getElementById("stepIndex");
    const segments = document.getElementById("segments");
    const sections = document.getElementById("sections");

    steps.forEach((step, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = `${String(i + 1).padStart(2, "0")}  ${step.title.replace("Introduction & ", "").replace("Installation Confirmation & ", "")}`;
      button.addEventListener("click", () => show(i));
      index.appendChild(button);

      const segment = document.createElement("button");
      segment.type = "button";
      segment.className = "segment";
      segment.setAttribute("aria-label", `Go to step ${i + 1}: ${step.title}`);
      segment.addEventListener("click", () => show(i));
      segments.appendChild(segment);

      const section = document.createElement("article");
      section.className = "section";
      section.innerHTML = `<h1>${step.title}</h1>${step.body}<nav class="bottom-nav" aria-label="Guide navigation"><button type="button" class="nav-btn prev" ${i === 0 ? "disabled" : ""}>${step.prev || "← Back"}</button><button type="button" class="nav-btn next">${step.next}</button></nav>`;
      section.querySelector(".prev").addEventListener("click", () => show(Math.max(0, i - 1)));
      section.querySelector(".next").addEventListener("click", () => i === 9 ? show(0) : show(i + 1));
      sections.appendChild(section);
    });

    function show(n) {
      document.querySelectorAll(".section").forEach((element, i) => element.classList.toggle("active", i === n));
      document.querySelectorAll(".step-index button").forEach((element, i) => element.classList.toggle("active", i === n));
      document.querySelectorAll(".segment").forEach((element, i) => element.classList.toggle("active", i <= n));
      document.getElementById("crumb").textContent = steps[n].crumb;
      document.getElementById("stepLabel").textContent = `Step ${n + 1} / 10`;
      window.scrollTo({ top: 0, behavior: "smooth" });
      lucide.createIcons();
    }

    function notice(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2800);
    }

    document.getElementById("guideLink").addEventListener("click", event => {
      event.preventDefault();
      show(0);
    });

    document.querySelectorAll("[data-placeholder]").forEach(link => {
      link.addEventListener("click", event => {
        event.preventDefault();
        notice(`${link.dataset.placeholder} destination has not been supplied yet.`);
      });
    });

    document.addEventListener("click", event => {
      if (event.target.id === "launchSelector") {
        notice("Component Selector destination has not been supplied yet.");
      }
      if (event.target.closest(".placeholder-link")) {
        event.preventDefault();
        notice("This source destination has not been supplied yet.");
      }
    });

    show(0);
  </script>
