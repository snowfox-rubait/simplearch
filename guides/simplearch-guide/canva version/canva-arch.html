  <script>
    const shot = caption => `<figure class="shot"><i data-lucide="terminal-square"></i><span>[ screenshot placeholder ]<br>${caption}</span></figure>`;
    const split = (copy, caption, reverse=false) => `<div class="split ${reverse?'reverse':''}"><div class="copy">${copy}</div>${shot(caption)}</div>`;
    const wide = caption => `<div class="wide-shot">${shot(caption)}</div>`;
    const cards = (a,b) => `<div class="cards"><article class="compare"><small>${a[0]}</small><h3>${a[1]}</h3><p>${a[2]}</p></article><article class="compare"><small>${b[0]}</small><h3>${b[1]}</h3><p>${b[2]}</p></article></div>`;
    const callout = (title,text) => `<aside class="callout"><i data-lucide="triangle-alert"></i><div><strong>${title}</strong><p>${text}</p></div></aside>`;
    const steps = [
      {crumb:"Guide > Introduction",title:"Introduction & TUI Navigation",next:"Next: Locales & Mirrors →",body:
        `<p class="intro">A quick orientation before touching the installer. Use the terminal and TUI deliberately; every selection here becomes part of your installation plan.</p>
        ${split(`<h2>Navigate the TUI</h2><p>Use arrow keys or <kbd>j</kbd>/<kbd>k</kbd> like vim. <kbd>/</kbd> opens a fuzzy finder only in sub-menus where it is available or enabled. <kbd>Esc</kbd> cancels and goes back from a sub-menu; <kbd>Enter</kbd> selects.</p><p>In multi-select menus, use <kbd>Space</kbd> rather than a single-select action. <kbd>Tab</kbd> does not work for this.</p><div class="note"><b>Initial defaults:</b> Archinstall language <code>default</code> · Locales <code>default</code></div>`,"Arch Linux ISO First Boot (Root shell prompt)")}
        ${split(`<h2>Start archinstall</h2><p>Run the installer from the root shell, then use the keyboard controls consistently as you move through each sub-menu.</p>`,"Running archinstall command in terminal",true)}
        ${wide("Archinstall TUI Main Menu & Keyboard Navigation Controls (vim keys j/k, Space for multi-select, Enter to select)")}
        <div class="block"><h2>Two approaches</h2>${cards(["Vanilla TUI","Browse menus independently and keep track of choices.",""],["SimpleArch Step Flow","Follow a deliberate sequence with a practical post-install target.",""])}</div>`},
      {crumb:"Guide > Mirrors & Repos",title:"Locales, Mirrors & Repositories",prev:"← Back: Introduction",next:"Next: Disk & Btrfs →",body:
        `<p class="intro">Set mirrors and repositories early so downloads are fast and the needed compatibility libraries are available.</p>
        ${split(`<h2>Choose nearby mirrors</h2><p>Set the region to your own country, or a nearby one, for better download speeds.</p>`,"Selecting Mirrors and Repositories in main menu")}
        ${split(`<h2>Find your region</h2><p>Open the region selection sub-menu and navigate the regional mirror list. Use fuzzy filtering where available to narrow it down.</p>`,"Opening Region selection sub-menu",true)}
        ${split(`<h2>Select country mirrors</h2><p>Confirm the resulting mirror list before continuing.</p>`,"Navigating inside the regional mirror list")}
        ${split(`<h2>Filter and confirm</h2><p>Use the selected country mirrors for the installation download path.</p>`,"Fuzzy-filtering and selecting country mirrors",true)}
        ${split(`<h2>Review mirror list</h2><p>Check the confirmed mirrors in the summary view.</p>`,"Summary view of confirmed mirror list")}
        ${split(`<h2>Add repositories</h2><p>Select optional repositories, then add <code>multilib</code>. Important 32-bit libraries are needed by Steam, Wine, and Proton, among other use cases.</p>`,"Selecting Optional Repositories",true)}
        ${split(`<h2>Enable multilib</h2><p>Toggle the <code>multilib</code> checkbox before leaving the repository settings.</p>`,"Enabling multilib checkbox (for 32-bit, Steam, Wine)")}
        ${wide("Final confirmed Mirrors and Repositories overview")}`},
      {crumb:"Guide > Disk & Filesystem",title:"Disk Partitioning, Encryption & Snapshots",prev:"← Back: Mirrors & Repos",next:"Next: Swap & Memory →",body:
        `<p class="intro">Choose a simple Btrfs layout, optionally protect it with LUKS, then enable snapshots for later rollback.</p>
        <div class="block"><h2>Disk & Btrfs Partitioning</h2>${split(`<p>Choose <code>Best-effort</code> in most cases, then <code>Btrfs</code>. Use the default volume structure, enable compression, and do not disable copy-on-write.</p>${callout("Do not touch LVM.","Leave LVM alone for this recommended flow.")}`,"Selecting Disk Configuration menu")}${split(`<p>Select the target installation disk carefully.</p>`,"Selecting target installation disk (/dev/vda)",true)}${split(`<p>Continue with the recommended automatic partitioning approach.</p>`,"Choosing Best-effort partitioning")}${split(`<p>Select the recommended filesystem.</p>`,"Selecting Btrfs filesystem",true)}${split(`<p>Keep the default Btrfs volume structure.</p>`,"Confirming default Btrfs subvolumes (@, @home)")}${split(`<p>Enable transparent <code>zstd</code> compression while keeping copy-on-write enabled.</p>`,"Enabling transparent zstd compression",true)}${wide("Completed partition layout overview")}</div>
        <div class="block"><h2>LUKS Disk Encryption</h2><p>Encryption is recommended. You can skip it, but it is strongly encouraged.</p>${split(`<ul><li>Encryption type: <code>LUKS</code></li><li>Set a personal encryption password.</li><li>Keep iteration time as is.</li><li>Select the partition.</li><li><code>HSM</code> is for a YubiKey or similar physical security key; most people should skip it after doing their own research.</li></ul>`,"Entering Disk Encryption menu")}${["Initial unencrypted state","Selecting LUKS encryption type","LUKS confirmed active","Entering & confirming encryption passphrase","Iteration time setting (leaving at default 10000ms)","Custom iteration time dialog (5000ms for VMs)","Selecting partition to apply encryption","Highlighting Btrfs partition (/dev/vda2)","Final encrypted partition layout confirmation"].map((x,i)=>split(`<p>${i===0?"Review the current disk state before enabling encryption.":"Continue through the LUKS configuration carefully."}</p>`,x,i%2===0)).join("")}</div>
        <div class="block"><h2>Btrfs Snapshots</h2>${split(`<p>After leaving the encryption sub-menu, select Btrfs snapshots. Choose <code>Snapper</code>. Timeshift is also good, but Snapper has advantages—mainly its later integration with boot-menu snapshot rollback.</p>`,"Selecting Btrfs Snapshots menu")}${split(`<p>Select the snapshot manager.</p>`,"Selecting Snapper as snapshot manager",true)}${wide("Summary view showing Snapper active on root")}</div>`},
      {crumb:"Guide > Swap",title:"Swap on zram & Performance Tuning",prev:"← Back: Disk & Filesystem",next:"Next: Bootloader & Splash →",body:
        `<p class="intro">Enable Swap on zram. Most of the extra options can be ignored.</p>${split(`<h2>Enable zram</h2><p>Toggle Swap on zram to <code>Yes</code>.</p>`,"Toggling 'Swap on zram' to Yes")}${split(`<h2>Modern hardware</h2><p>Choose <code>zstd</code> for modern CPUs.</p>`,"Modern Hardware Default: zstd compression algorithm",true)}${split(`<h2>Older or weak hardware</h2><p>Choose <code>lz4</code> for very old or weak hardware and lower CPU overhead. The rest is noise—skip it.</p>`,"Legacy Hardware Alternative: selecting lz4 for low CPU overhead")}`},
      {crumb:"Guide > Bootloader",title:"Bootloader & Plymouth Splash",prev:"← Back: Swap",next:"Next: Kernel Selection →",body:
        `<p class="intro">Use either <code>GRUB</code> or <code>Limine</code>. The other options lack the features needed to link snapshots to the bootloader in the desired Omarchy-style rollback setup.</p>
        ${split(`<h2>Choose a rollback-ready bootloader</h2><p>Move away from the default and select <code>Limine</code> or <code>GRUB</code>.</p>`,"Default systemd-boot highlighted (to be changed)")}
        ${split(`<p>The recommended bootloaders support the snapshot rollback direction used here.</p>`,"Selecting Limine (or GRUB) for snapshot rollback support",true)}
        ${split(`<h2>Plymouth</h2><p>On old hardware, keep Plymouth disabled. Otherwise enable it and select <code>details</code> for easier first-install diagnostics. Switch to a nicer theme later, after confirming everything works.</p>`,"Bootloader menu pointing to Plymouth option")}
        ${split(`<p>Review Plymouth setup warnings before confirming.</p>`,"Plymouth splash setup dialog & warnings",true)}
        ${split(`<p>Select the <code>details</code> theme for diagnostics.</p>`,"Selecting Plymouth 'details' theme for diagnostics")}
        ${callout("Keep Unified Kernel Image (UKI) disabled for now","Limine requires separate kernel/initramfs files, while UKIs bundle them into a single signed EFI executable. The combination needs extra tooling and can break both boot entries and snapshot rollback.")}
        ${split(`<h2>Unified Kernel Image</h2><p>A UKI bundles kernel, initramfs, and boot parameters into one signed executable. It can help later with Secure Boot, but keep it disabled now: Limine does not detect UKIs automatically. Getting this wrong can create a kernel-panicking boot entry and a missing snapshot menu.</p><p><b>Install to removable location:</b> keep disabled for a normal internal-disk desktop. It uses a generic fallback path; reserve it for portable USB installs or firmware with broken boot-entry handling.</p>`,"Unified Kernel Image prompt (Notice: keep disabled)",true)}
        ${wide("Final configured Bootloader settings summary")}
        <div class="block"><h2>Before and after</h2>${cards(["Before: Vanilla Default","systemd-boot, no snapshot menu",""],["After: SimpleArch Configured","Limine + Plymouth details + snapshot rollback",""])}</div>`},
      {crumb:"Guide > Kernels",title:"Kernel Selection & System Fallback",prev:"← Back: Bootloader",next:"Next: Hostname & Security →",body:
        `<p class="intro">You can select more than one kernel. A second kernel is a practical fallback when an update causes a regression.</p>
        ${split(`<h2>Official kernel choices</h2><ul><li><code>linux</code>: vanilla mainline Arch; closely tracks upstream, gets features and hardware support fastest, and is broadly tested and documented.</li><li><code>linux-lts</code>: Long Term Support; gets backported security and bug fixes without feature churn, trading bleeding-edge support for stability and fewer regressions.</li><li><code>linux-zen</code>: tuned for desktop responsiveness with scheduler patches; focused on perceived latency in gaming, audio/video work, and multitasking rather than raw throughput.</li><li><code>linux-hardened</code>: adds hardening and exploit mitigations; may trade performance and compatibility, especially with proprietary NVIDIA drivers and AUR packages expecting vanilla behaviour.</li></ul>`,"Listing the 4 official Arch kernels (linux, lts, zen, hardened)")}
        ${split(`<h2>Quick picks</h2><ul><li>Default / general use → <code>linux</code></li><li>Stability-focused / fallback safety net → <code>linux</code> + <code>linux-lts</code></li><li>Gaming / desktop responsiveness → <code>linux-zen</code> + <code>linux-lts</code></li><li>Security-focused → <code>linux-hardened</code> + <code>linux-lts</code> — note the NVIDIA/proprietary-driver caveat.</li></ul><p>Recommended combinations: <code>linux + linux-lts</code>, <code>linux-zen + linux-lts</code>, <code>linux-hardened + linux-lts</code>, or one kernel for simplicity.</p>`,"Multi-selecting dual kernels (linux + linux-lts fallback)",true)}
        ${cards(["Primary Mainline Kernel","Fastest feature and hardware support path.",""],["Long-Term Support (LTS) Fallback","A calmer backup route when mainline updates regress.",""])}`},
      {crumb:"Guide > Authentication",title:"Hostname, Authentication & Security",prev:"← Back: Kernel Selection",next:"Next: Profile Selection →",body:
        `<p class="intro">A hostname is the machine’s name—not the user’s name. Think <code>who @ which machine</code>: <code>haw@elitedesk-800</code>.</p>
        ${split(`<h2>Name the machine</h2><p>The hostname identifies the machine on a network and stays the same regardless of who logs in. A username identifies a specific account. Examples: <code>kitchen-pc</code>, <code>server-pc</code>, <code>laptop</code>.</p>`,"Setting machine hostname ('who @ which machine')")}
        ${split(`<h2>Root password</h2><p>For most users, leave the root password unset. Direct root login is then disabled, making <code>sudo</code> the only admin path. Root and <code>sudo</code> are not the same thing.</p>`,"Root password prompt (leaving blank to disable direct root login)",true)}
        ${split(`<h2>User account</h2><p>This is the important option. Add one or more users, set each username and password, and choose whether each receives <code>sudo</code>.</p>`,"User accounts menu (selecting 'Add a user')")}
        ${["Entering username","Setting and confirming user password","Toggling 'sudo' / wheel group access to Yes","Multi-user management / creating restricted non-sudo accounts","Exiting user configuration menu"].map((x,i)=>split(`<p>Complete the user account settings deliberately.</p>`,x,i%2===0)).join("")}
        ${split(`<h2>U2F login setup</h2><p>This enrolls a physical YubiKey/FIDO2-style key for login, analogous to the <code>HSM</code> option in disk encryption.</p>`,"U2F / FIDO2 physical hardware security key setup menu",true)}`},
      {crumb:"Guide > Profile",title:"Profile Selection (Minimal vs Desktop Bundles)",prev:"← Back: Hostname & Security",next:"Next: Network & Applications →",body:
        `<p class="intro">Pick the installation base that matches how much of the graphical system you want bundled up front.</p>
        ${split(`<h2>Profile types</h2><ul><li><code>Desktop</code>: a bundle of compositors, window managers, and full desktop environments. It needs an internet connection; pre-installed does not mean pre-configured.</li><li><code>Minimal</code>: no desktop environment, window manager, or graphical stack; boots to a console. Useful for building everything yourself or when no internet is available during install.</li><li><code>Server</code>: a headless SSH box.</li><li><code>Xorg</code>: only the Xorg display server.</li></ul>`,"Entering Profile menu")}
        ${split(`<p>Review the four type choices before selecting.</p>`,"Profile Type choices: Desktop, Minimal, Server, Xorg",true)}
        ${["Previewing Server profile options","Previewing Xorg profile options","Multi-select Desktop Environment options view","Desktop Environment bundle selection (Hyprland example)","Seat access selection (seatd for Wayland compositors)","Display Manager / Greeter options list (SDDM, ly, GDM, LightDM)","Selecting SDDM greeter for Hyprland","Graphics driver default ('All open-source drivers')","Graphics driver options menu"].map((x,i)=>split(`<p>${i<2?"Preview the profile route before committing.":"Inspect these bundle choices only if a bundled desktop genuinely suits your setup."}</p>`,x,i%2===0)).join("")}

        <h2>Gallery Slot B — graphics drivers</h2><div class="gallery drivers">${["All Open-Source","AMD/ATI","Intel","NVIDIA open-kernel","NVIDIA Nouveau"].map(x=>`<div>${x}</div>`).join("")}</div>`},
      {crumb:"Guide > Services",title:"Applications, Network & System Services",prev:"← Back: Profile Selection",next:"Next: Installation Confirmation →",body:
        `<p class="intro">This Application step is not general app installation. It covers Bluetooth, printers, audio, firewall, fonts, networking, Pacman, packages, and time.</p>
        ${split(`<h2>Applications and services</h2><ul><li>Bluetooth: <code>yes</code></li><li>Audio: <code>PipeWire</code>, not PulseAudio — <span class="placeholder-link">[Source placeholder: PipeWire comparison link]</span></li><li>Printing services: <code>yes</code></li><li>Firewall: <code>ufw</code> for simplicity; <code>firewalld</code> for advanced setups — <span class="placeholder-link">[Source placeholder: firewall comparison link]</span></li><li>Additional fonts: optional.</li></ul>`,"Audio server selection: choosing PipeWire")}
        ${["NetworkManager backend: choosing iwd (modern Wi-Fi) or default","NetworkManager completed setup summary","Applications menu: Bluetooth selection","Confirming Bluetooth enabled (Yes)","Printing services (CUPS) enabled (Yes)","Firewall selection: choosing UFW for desktop simplicity","Optional terminal fonts selection","Additional packages entry menu","Timezone region selection list","Fuzzy-filtering local timezone"].map((x,i)=>split(`<p>${i<2?"Use the default NetworkManager backend for Wi-Fi hardware predating roughly 2014; use `iwd` for newer hardware. It is generally more efficient but newer and less battle-tested; Intel often does well, while some Realtek chipsets have rougher experiences. [Source placeholder: detailed network comparison link]":i<8?"Confirm the relevant service choice.":"Use the fuzzy finder to choose your timezone."}</p>`,x,i%2===1)).join("")}
        <div class="block"><h2>Pacman, packages & time</h2><p>For Pacman, enable <code>color</code> and nothing else. Additional packages are optional, require internet, and can be installed post-install. <span class="placeholder-link">[Unresolved content placeholder: essential package list]</span></p><p>Keep Automatic time sync enabled.</p></div>`},
      {crumb:"Guide > Install & Reboot",title:"Installation Confirmation & Reboot",prev:"← Back: Applications & Services",next:"Back to Top",body:
        `<p class="intro">Double-check every selection, then choose Install. Confirmation is irreversible.</p>
        ${split(`<h2>Install deliberately</h2><p>Choose <code>Install</code>, then confirm when prompted. Typical installation time is 3–10 minutes depending on internet, disk, and CPU. More than 15 minutes likely indicates a problem.</p>`,"Selecting the final 'Install' menu button")}
        ${split(`<p>Confirm the irreversible installation action.</p>`,"Final confirmation prompt ('Would you like to install? Press yes')",true)}
        ${split(`<p>Wait for the installation to complete.</p>`,"Live installation countdown timer")}
        ${split(`<h2>Reboot into the new system</h2><p>The completion prompt asks <b>What would you like to do next?</b> Choose from exactly:</p><ol><li>Exit archinstall</li><li><b>Reboot system</b> (recommended)</li><li>chroot into installation for post-installation configurations</li></ol><p>Select <b>Reboot system</b>, press <kbd>Enter</kbd>, and remove the USB installation flash drive when the machine restarts.</p>`,"Installation complete dialog: selecting 'Reboot system'",true)}
        <section class="final"><h2>Reboot into Clean Arch → Run SimpleArch Selector</h2><p>Remove the installation USB drive and reboot. Your clean Arch base is ready for SimpleArch.</p><button type="button" class="nav-btn next" id="launchSelector">Launch SimpleArch Component Selector</button></section>`}
    ];
    const index = document.getElementById("stepIndex"), segments=document.getElementById("segments"), sections=document.getElementById("sections");
    steps.forEach((s,i)=>{
      const b=document.createElement("button");b.type="button";b.textContent=`${String(i+1).padStart(2,"0")}  ${s.title.replace("Introduction & ","").replace("Installation Confirmation & ","")}`;b.addEventListener("click",()=>show(i));index.appendChild(b);
      const p=document.createElement("button");p.type="button";p.className="segment";p.setAttribute("aria-label",`Go to step ${i+1}: ${s.title}`);p.addEventListener("click",()=>show(i));segments.appendChild(p);
      const sec=document.createElement("article");sec.className="section";sec.innerHTML=`<h1>${s.title}</h1>${s.body}<nav class="bottom-nav" aria-label="Guide navigation"><button type="button" class="nav-btn prev" ${i===0?"disabled":""}>${s.prev||"← Back"}</button><button type="button" class="nav-btn next">${s.next}</button></nav>`;sec.querySelector(".prev").addEventListener("click",()=>show(Math.max(0,i-1)));sec.querySelector(".next").addEventListener("click",()=>i===9?show(0):show(i+1));sections.appendChild(sec);
    });
    function show(n){document.querySelectorAll(".section").forEach((x,i)=>x.classList.toggle("active",i===n));document.querySelectorAll(".step-index button").forEach((x,i)=>x.classList.toggle("active",i===n));document.querySelectorAll(".segment").forEach((x,i)=>x.classList.toggle("active",i<=n));document.getElementById("crumb").textContent=steps[n].crumb;document.getElementById("stepLabel").textContent=`Step ${n+1} / 10`;window.scrollTo({top:0,behavior:"smooth"});lucide.createIcons();}
    function notice(text){const t=document.getElementById("toast");t.textContent=text;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800)}
    document.getElementById("guideLink").addEventListener("click",e=>{e.preventDefault();show(0)});
    document.querySelectorAll("[data-placeholder]").forEach(x=>x.addEventListener("click",e=>{e.preventDefault();notice(`${x.dataset.placeholder} destination has not been supplied yet.`)}));
    document.addEventListener("click",e=>{if(e.target.id==="launchSelector")notice("Component Selector destination has not been supplied yet.")});
    show(0);
  </script>
